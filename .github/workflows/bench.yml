name: Benchmarks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'benchmarks/**'
      - 'crates/**'
      - 'tests/**'
      - 'utils/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/bench.yml'
  push:
    branches: [master]
    paths:
      - 'benchmarks/**'
      - 'crates/**'
      - 'tests/**'
      - 'utils/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/bench.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BINARYEN_VERSION: version_123

jobs:
  benchmark:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-benchmarks')) ||
        (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dsherret/rust-toolchain-file@v1

      - name: Set up Rust for wasm
        run: rustup component add rust-src --toolchain stable

      - name: Install wasm-opt
        run: |
          sudo wget -c https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION/binaryen-$BINARYEN_VERSION-x86_64-linux.tar.gz -O - | sudo tar -xz -C .
          sudo cp binaryen-$BINARYEN_VERSION/bin/wasm-opt /usr/bin/

      - name: Build Analyzer
        run: cargo build --release -p awesome-sails-benchmarks --bin bench-analyzer

      - name: Run Benchmarks
        run: cargo test --release -p awesome-sails-benchmarks

      - name: Compare with Master Baseline
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin master:refs/remotes/origin/master
          git show origin/master:benchmarks/bench_data.json > benchmarks/baseline.json || echo "{}" > benchmarks/baseline.json
          ./target/release/bench-analyzer \
            --current benchmarks/bench_data.json \
            --other benchmarks/baseline.json \
            --output benchmarks/comparison.md

      - name: Read Comparison Result
        if: github.event_name == 'pull_request'
        id: comparison
        run: |
          if [ -f benchmarks/comparison.md ]; then
            echo 'COMPARISON_TABLE<<EOF' >> $GITHUB_OUTPUT
            cat benchmarks/comparison.md >> $GITHUB_OUTPUT
            echo 'EOF' >> $GITHUB_OUTPUT
          fi

      - name: Comment PR with Benchmark Comparison
        if: github.event_name == 'pull_request' && steps.comparison.outputs.COMPARISON_TABLE != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comparisonTable = `${{ steps.comparison.outputs.COMPARISON_TABLE }}`;
            const commentBody = `${comparisonTable}
            
            ---
            <sub>🤖 This comment was automatically generated by the benchmark comparison workflow at ${{ github.sha }}.</sub>`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });